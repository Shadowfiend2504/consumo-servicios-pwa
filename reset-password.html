<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.gstatic.com https://www.googleapis.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>Restablecer contraseña - Control de Consumo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b5cff">
</head>

<body>
  <main class="login-screen-layout" aria-label="Restablecimiento de contraseña">
    <section class="login-form-container">
      <div class="login-form-content">
        <div class="text-center mb-4">
          <div class="brand-logo-large mb-3">
            <i class="bi bi-shield-lock" style="font-size:28px;color:#fff;"></i>
          </div>
          <h1 style="color: var(--primary); font-weight: 700; font-size: 22px; margin:0;">Restablecer contraseña</h1>
          <p id="resetStatus" class="text-muted small mt-1">Validando enlace...</p>
        </div>

        <form id="resetPasswordForm" novalidate>
          <div class="mb-3">
            <label for="newPassword" class="form-label fw-500 small">Nueva contraseña <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
              <input type="password" id="newPassword" class="form-control border-start-0" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
            </div>
            <small class="text-muted d-block mt-1" style="font-size: 11px;">Debe incluir mayúscula, número y símbolo.</small>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label fw-500 small">Confirmar contraseña <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill"></i></span>
              <input type="password" id="confirmPassword" class="form-control border-start-0" placeholder="Repite tu nueva contraseña" minlength="8" autocomplete="new-password" required>
            </div>
          </div>

          <button type="submit" id="resetSubmitBtn" class="btn btn-primary w-100 fw-600 mb-2" disabled>
            <i class="bi bi-check2-circle"></i> Guardar nueva contraseña
          </button>

          <a href="index.html" class="btn btn-outline-secondary w-100 btn-sm">Volver al inicio de sesión</a>
        </form>
      </div>
    </section>
    <section class="login-image-container" aria-hidden="true"></section>
  </main>

  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
    <div id="toast-container"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/reset-password.js"></script>
</body>

</html>
